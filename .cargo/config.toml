[profile.release]
lto = true
codegen-units = 1
strip = true

[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]

[target.'cfg(all(target_arch = "aarch64", target_env = "msvc"))']
# Portable: linker only, no paths. Covers both aarch64-pc-windows-msvc
# (packaging/build_win32.cmd) and the custom aarch64-win7-windows-msvc
# triple (packaging/build_win7arm.cmd). Library dirs come from build.rs
# (cargo:rustc-link-search: repo-local packaging/arm64-libs plus the
# machine-local MSVC/SDK ARM64 dirs read from the vcvars environment).
# NOTE: the scripts pin vcvars to MSVC 14.44 (-vcvars_ver=14.44), the
# toolchain with the complete ARM64 set (HostX64\arm64 tools plus
# lib\arm64\msvcrt.lib/oldnames.lib). rust-lld links it fine.
linker = "rust-lld"
rustflags = ["-Clinker-flavor=lld-link"]
