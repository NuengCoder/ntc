name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Create archive
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"
          ARCH=${{ matrix.target == 'aarch64-apple-darwin' && 'aarch64' || 'x86_64' }}
          ARCHIVE_NAME="ntc-v${VERSION_NO_V}-macos-${ARCH}.tar.gz"
          mkdir -p release-artifacts
          cp "target/${{ matrix.target }}/release/ntc" .
          tar -czvf "release-artifacts/${ARCHIVE_NAME}" ntc
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: release-artifacts/*.tar.gz

  release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect assets
        run: |
          mkdir -p release-assets
          find artifacts -name '*.tar.gz' -exec cp {} release-assets/ \;
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: |
          VERSION="${{ github.ref_name }}"
          VERSION_NO_V="${VERSION#v}"
          mkdir -p npm-package
          cp -r packaging/npm/* npm-package/
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION_NO_V\"/" npm-package/package.json
      - run: npm publish ./npm-package --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
