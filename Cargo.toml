[package]
name = "ntc"
version = "2.4.2"
edition = "2021"
description = "Navigate, Toolkit, Center - A Combine of Navigation , Project Toolkit Center hub"
authors = ["NuengCoder"]
license = "MIT"

[[bin]]
name = "ntc"
path = "src/main.rs"

[lib]
name = "ntc"
path = "src/lib.rs"

[features]
default = ["image2doc", "ocr"]
image2doc = ["dep:image"]
ocr = []

[dependencies]
clap = { version = "4.5", features = ["derive"] }
walkdir = "2.5"
rustyline = "15.0"
anyhow = "1.0"
chrono = "0.4"
dirs = "6.0"
indicatif = "0.17"
image =  { version = "0.25" , optional = true }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
colored = "3"
rayon = "1.10"
notify = "7"
ctrlc = "3.4"
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"
rand = "0.10"
libc = "0.2"
crossterm = "0.29"
sysinfo = "0.33"
portable-pty = "0.8"
vte = "0.13"
ureq = "3"
base64 = "0.22"
encoding_rs = "0.8"
qrcode = "0.14"
rqrr = "0.10"
lettre = { version = "0.11", default-features = false, features = ["rustls-tls", "smtp-transport", "builder", "hostname"] }
rusqlite = { version = "0.32", features = ["bundled"] }
mime_guess = "2"
rust-embed = "8"
which = "7"
zip = "2"
tar = "0.4"
flate2 = "1"
xz2 = "0.1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
]

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = "3.4"
printpdf = "0.5"
docx-rs = "0.4"
rust_xlsxwriter = "0.95"

# Android/Termux specific
[target.'cfg(target_os = "android")'.dependencies]
# No arboard, printpdf, docx-rs, rust_xlsxwriter on Android

[dev-dependencies]
tempfile = "3.15"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[package.metadata.deb]
maintainer = "Nueng <thilaphonneung@gmail.com>"
copyright = "2026, Nueng"
license-file = ["LICENSE", "3"]
extended-description = """\
ntc is a  Combine of Navigation , Project Toolkit Center hub.
It helps navigate, visualize, and report on directory structures."""
depends = "$auto"  # Automatically detects if you need libc, etc.
[patch.crates-io]
termios = { path = "patches/termios" }