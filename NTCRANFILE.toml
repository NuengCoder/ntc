# NTCRANFILE — ntc task runner configuration
# Usage:
#   ran            → runs [targets.standalone]
#   ran <name>    → runs a specific target
#   ran list      → lists all targets
#   ran init      → creates this file
#   ran help    → shows full usage with examples

# ── Variables ──────────────────────────────────────────────────────────
# Define variables here and reference them with $(VAR_NAME) in commands.
#
# Example:
#   CC     = "gcc"
#   FLAGS  = "-Wall -O2"
#   OUTDIR = "dist"
#
# Then use them: cmd = "$(CC) $(FLAGS) main.c -o $(OUTDIR)/app"

[vars]
# CC = "gcc"
# FLAGS = "-O2"
ver = "2.4.3"
lux = "ntc-v$(ver)-linux-x86_64.tar.gz"
adb = "ntc-v$(ver)-aarch64-linux-android.tar.gz"
win = "ntc-v$(ver)-windows-x86_64.zip"
deb = "ntc_$(ver)-1_amd64.deb"
wini = "ntc-installer-$(ver).exe"
win_arm = "ntc-v$(ver)-windows-arm64.zip"

lux_w = "target/release"
adb_w = "target/aarch64-linux-android/release"
win_w = "target/release/ntc.exe"
deb_w = "target/debian/ntc_$(ver)-1_amd64.deb"
wini_w = "installer/ntc-installer-$(ver).exe"
win_arm_w = "target/aarch64-pc-windows-msvc/release/ntc.exe"

# ── Targets ────────────────────────────────────────────────────────────
# Each target can have:
#   deps — list of other targets that must run first
#   cmd  — shell command to execute (goes through ntc's alias system, so
#          run aliases, @teleports, and system commands all work)

[targets]

[targets.standalone]
# Default target — runs when `ran` is typed without arguments
deps = []
cmd = "cargo build --release && echo done...!"

[targets.build]
deps = []
cmd = "cargo build --release && start installer.iss"

[targets.reset]
deps = []
cmd = "cargo clean && cargo build --release"

[targets.win32]
deps = []
cmd = "packaging\\build_win32.cmd"

[targets.android]
deps = []
cmd = "cargo ndk --target aarch64-linux-android --platform 23 build --release"

[targets.debian]
deps = []
cmd = "cargo deb"

[targets.tar]
deps = []
cmd = "tar -czvf $(lux) -C $(lux_w) ntc && tar -czvf $(adb) -C $(adb_w) ntc"

[targets.zip]
deps = []
cmd = "powershell Compress-Archive -Path $(win_w) -DestinationPath $(win)"

[targets.zip_arm]
deps = []
cmd = "powershell Compress-Archive -Path $(win_arm_w) -DestinationPath $(win_arm)"

[targets.cpdeb]
deps = []
cmd = "COPY $(deb_w) $(deb)"

[targets.cpwin]
deps = []
cmd = "COPY $(wini_w) $(wini)"

[targets.setpack]
deps = ["tar","zip","zip_arm","cpdeb","cpwin"]
cmd = "echo pack setup completed!"

[targets.rmpack]
deps = []
cmd = "rmf $(lux) && rmf $(adb) && rmf $(win) && rmf $(deb) && rmf $(wini) && rmf $(win_arm)"

[targets.padb]
deps = []
cmd = "adb push ntc-v$(ver)-aarch64-linux-android.tar.gz /sdcard/Download/"

[targets.deploy]
deps = []
cmd = "C:\\Users\\Trivico\\cloudflared.exe tunnel --url http://localhost:8080"

[targets.push]
deps = []
cmd = "git add . && git commit -m $(ver) && git tag v$(ver) && git push origin main --tags"

[targets.rmtag]
deps = []
cmd = "git tag -d v$(ver) && git push origin --delete v$(ver)"

[targets.repush]
deps = []
cmd = "git push origin --delete v$(ver) && git push origin main --tags"

[targets.pull]
deps = []
cmd = "git pull origin main --rebase"

[targets.clean]
deps = []
cmd = "cargo clean"